name: ci

on:
  push:
    branches: [solana]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Must match Anchor.toml [toolchain] and programs/ayni/Cargo.toml.
      SOLANA_VERSION: 2.1.21
      ANCHOR_VERSION: 0.31.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          curl -sSfL -o /usr/local/bin/anchor \
            "https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x /usr/local/bin/anchor
          anchor --version

      - name: Localnet wallet
        run: solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json

      - name: JS deps
        run: yarn install --frozen-lockfile || npm install

      - name: Build
        run: anchor build

      - name: Test (no-ZK suites)
        run: anchor test
