[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
ayni = "3ogteUFYhbHaV7UEWuGCqGVm1X4HDgAswvSePvDspHCw"

[programs.devnet]
ayni = "3ogteUFYhbHaV7UEWuGCqGVm1X4HDgAswvSePvDspHCw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/aha-deployer.json"

[scripts]
# f28-election.ts is a devnet SCRIPT, not a mocha suite: it runs on import
# against the deployed program with the real deployer key, so the glob must skip
# it or `anchor test` stalls against devnet instead of the local validator.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/ayni.ts tests/resilience.ts tests/cosign.ts tests/faucet.ts tests/epic1.ts"

[test]
startup_wait = 60000
shutdown_wait = 2000
upgradeable = false
