[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
ayni = "AHAHnRiJEANtYJpWZxGZZa63ZTFzMa5e5Q8DszCgavSG"

[programs.localnet]
ayni = "AHAHnRiJEANtYJpWZxGZZa63ZTFzMa5e5Q8DszCgavSG"

[registry]
url = "https://api.apr.dev"

[provider]
# localnet so bare `anchor test` / `make test` / scripts/test.sh spin a local
# validator (the documented flow). Deploy targets a cluster at deploy time
# (`anchor deploy --provider.cluster devnet`), not via this test-time default.
cluster = "localnet"
wallet = "~/.config/solana/aha-deployer.json"

[scripts]
test = "NODE_OPTIONS=--experimental-global-webcrypto node_modules/.bin/ts-mocha -p ./tsconfig.json -t 1000000 tests/ayni.ts tests/resilience.ts tests/cosign.ts tests/faucet.ts tests/epic1.ts tests/epic3.ts tests/epic5.ts tests/profile.ts tests/federation.ts tests/audit-fixes.ts tests/epic2.ts tests/relayer.ts tests/mailbox.ts tests/jazzicon.ts tests/sharding.ts tests/quipu.ts"

[test]
startup_wait = 60000
shutdown_wait = 2000
upgradeable = false
