# One command to launch the AHA · Ayni frontend:
#
#     docker compose up --build
#
# Then open http://localhost:3000
#
# Override any value with a .env file next to this file (or shell env), e.g.
#     NEXT_PUBLIC_RPC_URL=https://devnet.helius-rpc.com/?api-key=KEY
#     NEXT_PUBLIC_FOUNDATION_CIRCLE=DH6uDzb77mZuF8TP2ucdHUkwyW6wyZkJj8nm3i79EAUo

services:
  frontend:
    build:
      context: .
      args:
        # Inlined into the client at build time:
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_IPFS_GATEWAY: ${NEXT_PUBLIC_IPFS_GATEWAY:-https://w3s.link/ipfs/}
        NEXT_PUBLIC_FOUNDATION_CIRCLE: ${NEXT_PUBLIC_FOUNDATION_CIRCLE:-DH6uDzb77mZuF8TP2ucdHUkwyW6wyZkJj8nm3i79EAUo}
        NEXT_PUBLIC_AHA_EMAIL_DOMAIN: ${NEXT_PUBLIC_AHA_EMAIL_DOMAIN:-aha.community}
    image: aha-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side only (the /api/circle-email route). Optional — without
      # SMTP_HOST the address is still assigned, just no mail is sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AHA_EMAIL_DOMAIN: ${AHA_EMAIL_DOMAIN:-aha.community}
    restart: unless-stopped
