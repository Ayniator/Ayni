[package]
name = "ayni"
version = "0.1.0"
description = "Ayni — Solana implementation of AHA (Ancestral Humanity Anonymous)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "ayni"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
# Token-2022 (soulbound membership) + SPL helpers.
anchor-spl = "0.30.1"
# On-chain Groth16 verification over BN254 via the alt_bn128 syscalls.
groth16-solana = "0.0.3"
