# are in this checklist.yaml itself, a .yaml the sweep does not scan). (3)
# tests/audit-fixes.ts (3 new cases: negative recovery_timelock rejection,
# MigrateWallet one-holder-per-seat dedup, full donate_token ->
# withdraw_treasury_token SPL e2e + one-shot replay guard) exists, is wired
