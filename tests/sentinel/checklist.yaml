features:
  # id, what Sentinel checks, where it is covered today.
  - id: F35
    name: Epic 0 — gas faucet (+ F47 treasurer ledger, F48 disbursement jitter)
    shipped_round: 2
    covered_by: [tests/faucet.ts, tests/sentinel/privacy-sweep.sh]
    checks:  # cheap static presence gates (F46) — fail loudly if the feature is deleted/renamed
      - cmd: test -f programs/ayni/src/instructions/init_faucet.rs && test -f programs/ayni/src/instructions/activate_faucet.rs && test -f programs/ayni/src/instructions/refill_faucet.rs && test -f programs/ayni/src/instructions/set_faucet_amount.rs
      - cmd: grep -q "pub struct FaucetJar" programs/ayni/src/state.rs
      - cmd: grep -q "pays the neophyte exactly one uniform grant" tests/faucet.ts
      # F35 Traditions fix: the anonymous activation path must exist, must be
      # the client's default, and must name NO parrain account. If any of
      # these disappears the sponsor edge is back on chain.
      - cmd: test -f programs/ayni/src/instructions/activate_faucet_zk.rs
      - cmd: grep -q "parrain_membership" programs/ayni/src/instructions/activate_faucet_zk.rs && exit 1 || exit 0   # NO parrain account in the anonymous path
      - cmd: grep -q "activate_faucet_zk" programs/ayni/src/lib.rs
      - cmd: grep -q "activateFaucetAnonymously" frontend/lib/faucet.ts
      - cmd: grep -q "activateFaucetAnonymously" frontend/app/me/page.tsx
      - cmd: grep -q "activate_faucet_zk" frontend/lib/relayPolicy.ts
      - cmd: grep -q "the anonymous activation names NO parrain" tests/faucet.ts
    cases:
      - init by seat / refused to non-seat
      - Treasurer tunes within cap; above cap, zero, non-Treasurer, non-seat refused
      - one uniform grant paid to the neophyte's own wallet, parrain-triggered
      - second grant for the same commitment refused (nullifier init collision)
      - non-wing member and non-wing seat both refused
      - owner-less neophyte and wrong recipient refused
      - underfunded jar refused, rent floor preserved
      - refill refused when the vote is unfinalized or the hash does not match
      - jar isolation across two circles
      - Treasurer cannot aim a distinctive amount at one neophyte (cooldown)
      - "ANONYMOUS path (F35): the built activate_faucet_zk instruction
         contains no parrain membership PDA and no parrain wallet, only the
         neophyte's membership, and exactly one signer (the fee-payer) at the
         index the relay policy pins"
      - "anonymous path refuses an unknown root (RootNotRecent) before proof work"
      - "anonymous path refuses a garbage proof against the CURRENT root
         (VoteProofInvalid) and the jar pays nothing"
      - "the two paths share the ['faucetnull', circle, commitment] one-shot and
         cannot be stacked for two grants"
      - "anonymous path keeps the recipient checks (WalletMismatch,
         NeophyteWalletUnset)"
      - "faucet_external_nullifier proptest (crate::proptests): deterministic,
         in-field, bound to (circle, neophyte), and never equal to the raw
         commitment attest_admission_zk uses — the domain separation that stops
         one member's two anonymous acts from sharing a nullifier"
    uncovered:
      - "refill ceiling (FaucetRefillTooLarge) and the happy-path refill: both sit
         behind `finalized && passed`, which needs a real Groth16 ballot — belongs
         to the devnet flow in tests/f28-election.ts"
      - no UI-level test of the treasurer panel or the parrain button
      - "F47 treasurer ledger (lib/faucetLedger.ts + /api/faucet-ledger) — code
         reviewed and Layer-D-assessed by Sentinel round 2 (see NRR-2 assertion
         #7), found sound in design, but has NO executable test: seal/open
         round-trip, fixed-size blob validation on the route, non-treasurer
         cannot decrypt, queue flush."
      - "F48 activation jitter (15-120s, me/page.tsx:353-356) + ledger delivery
         jitter (1-7min, faucetLedger.ts:37) — code-reviewed present and
         correctly wired; no automated decorrelation test exists (needs an
         adversarial suite)."
      - "END-TO-END ZK for activate_faucet_zk: a REAL member_vote Groth16 proof
         under the faucet's domain-separated external nullifier, granting first
         gas. Same gap (and same reason) as F53's attest_admission_zk — needs
         the browser/devnet proving flow that cannot run headless. Until then
         the anonymous faucet path is verified by construction (same VK, same
         public-signal order as the F28-proven ballot) plus the negative cases
         above. WARNING in round f35-f63v2 (shipped this round, reconfirmed
         still uncovered); FAILS the round after this one if the devnet flow
         still has not exercised it by then."
      - "Layer-D assertion 7 (parrain-neophyte unlinkability) is now partly
         mechanical — the account-shape test above — but no adversarial suite
         yet correlates the RELAYER's timing/IP channel or the WingPeer lookup
         an observer can do independently (docs/faucet.md 'what still leaks')."
      - "SELF-ENDORSEMENT: a tree member already admitted (with an active
         WingPeer bond naming ANY real distinct wing) can now produce their own
         member_vote proof and trigger their own first-gas grant — the named
         path could not be self-served (establish_wing_peer refuses
         mentee==wing), but the anonymous instruction has no circuit-level way
         to compare the endorser against the neophyte. Sentinel judged this
         NOT CRITICAL (no privacy invariant or Traditions rule broken; the
         economic bound — one grant ever, uniform amount, own wallet, own jar,
         membership-door-gated — is unchanged) but flags it as a genuine
         loosening of the ceremony, reported in the f35-f63v2 NRR. No
         regression test pins this boundary yet — a gap for the NEXT round to
         close (either accept-and-test, or a written waiver + F44 circuit
         work to close it for real)."

  - id: F50-F52
    name: Epic 1 — two-sponsor admission (amended v0.2)
    shipped_round: 2
    covered_by: [tests/epic1.ts]
    cases:
      - legacy issuance auto-creates the policy PDA with required=false
      - policy toggle seat-gated; legacy door closes when required
      - attestation refused from non-member / self
      - provisional issuance requires the attestation PDA
      - provisional leaves the member tree and member_count untouched
      - one parrain attestation per newcomer (PDA collision)
      - confirm is seat-gated; distinct-persons rule (parrain's seat refused)
      - confirm inserts into the tree, increments count, closes the marker (one-shot)
      - policy off restores the legacy door
      - "round 2 Sentinel confirmed by reading the code (not by new test): the
         member-tree insert (merkle::insert_leaf) and member_count increment
