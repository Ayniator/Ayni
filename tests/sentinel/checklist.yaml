      - "18-locale translation propagation for this round's 203 new i18n keys
         (recovery.*, shard.send.*, shard.receive.*, onboarding.f78.*,
         me.recovery.*) had not landed as of this review: all 203 keys exist
         ONLY in the English block of frontend/lib/i18n.generated.ts (0/203
         present in the other 18 locale blocks), confirmed by exact count.
         Disclosed by the main agent as in-progress in parallel at task
