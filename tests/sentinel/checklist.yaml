      - "The shield tx really is signed by the wallet being unbound (own
        code read of shield_membership.rs's Accounts struct + docs/
        visibility.md's own admission) -- transaction-graph linkage is real
        and correctly disclosed, not fixed."
      - "Frontend write paths other than publishProfile/grantElementKeys
        really do not carry the derived signer (createPost, tie_quipu_cord,
        set_visibility, wing peers, attestations all still assume owner ==
        connected wallet) -- confirmed by grep; matches docs/visibility.md §4."
    findings_this_round:
      - severity: CRITICAL
        what: "The shielded owner key F61 hands the member has a ZERO SOL
          balance, and NOTHING in the codebase funds it. upsert_member_profile
          requires `payer = member` (the Rust Anchor constraint), so the
          shielded key must itself pay PDA rent (3,473,040 lamports observed)
          for its own first write. Neither shield_membership,
          publishProfile(), nor any surrounding code transfers SOL to the
          newly-derived pubkey. This is NOT the already-disclosed fee-payer
          caveat in docs/visibility.md §1 (which is about who pays the
          SHIELD transaction's fee) -- it is a separate, undisclosed gap in
          the two write paths docs/visibility.md §2 claims DO carry the
          derived signer and therefore work."
        reproduction: "anchor test --skip-build   # fresh local validator,
          2 independent runs, byte-identical failure both times:
          'Transfer: insufficient lamports 0, need 3473040' at
          UpsertMemberProfile, tests/epic5.ts:267ish ('serves the bio as
          ciphertext...'), cascading into 3 more failures in the same
          describe block (all downstream of the same unfunded shieldedOwner
          keypair -- tests/epic5.ts never airdrops it, unlike every other
          keypair in the file's `before()` hook)."
        consequence: "As shipped, shielding a membership either (a) makes
          the member unable to publish a profile or grant a key at all
          (silent breakage matching this reproduction), or (b) if the member
          manually funds the derived key -- the only practical route being a
          transfer FROM their known wallet -- creates a direct, single-hop,
          same-amount balance transfer from a real-world-linked wallet to
          the 'anonymous' shielded pubkey: one of the most reliable
          chain-analysis clustering heuristics that exists (the funding-
          source heuristic), WORSE than and NOT covered by the fee-payer
          caveat already disclosed. Either way F61's core privacy claim is
          undermined in real use, not merely 'not yet UI-wired' as
          docs/visibility.md §4 currently frames it."
        disposition: "CRITICAL, contributes to round FAIL. Not a caching or
          environment artifact -- the missing airdrop in the test IS the bug
          made visible; a real member's wallet has the identical problem
          (nobody funds the derived key either)."
      - severity: LOW/MEDIUM, not independently blocking
        what: "OwnerTag and VisibilityKeyDrop are both `init`-only PDAs
          (fail-if-taken, never overwritten -- confirmed sound against
          overwrite). But `tag` / `drop_id` are plain instruction arguments,
          not bound on-chain to the caller's own membership or secret; an
          observer who sees a pending shield_membership or
          grant_visibility_key transaction (Solana leader-forwarding / MEV
          surface, lower-likelihood than a public Ethereum mempool but real)
          could front-run with the SAME tag/drop_id and junk data, making the
          legitimate `init` fail -- a griefing denial-of-service (forces a
          retry at a new index/epoch), not a data or privacy compromise. Not
          covered by any test. Worth a regression test and consideration,
          not a blocker on its own."
    uncovered:
      - "no Playwright test that a viewer outside the audience sees a
        byte-shape-identical bare page (still open, carried from the F60-F61
        round-5 entry above)"
      - "no test at all for the front-running/squat scenario just above"
      - "no test that the shielded key's funding requirement is disclosed or
