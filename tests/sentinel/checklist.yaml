  # --- F84: surfaced mid-round (see the F82/F83 NRR timeline), given its
  # backlog identity the same day — BACKLOG.md row F84, docs/shipped.md
  # F82/F83/F84 section. Covers the /me AnonymousNote zk-link and the
  # BrandAyni tooltip link order (GitHub before Wikipedia).
  - id: F84
    name: "/me page: AnonymousNote component (in-sentence zk-proof Wikipedia link)"
    covered_by: []  # only this checklist's own grep/node checks below exist;
                     # no e2e/Playwright suite (Layer A gap, carried forward).
    checks:
      - cmd: grep -q "function AnonymousNote" frontend/app/me/page.tsx
      - cmd: grep -q "https://en.wikipedia.org/wiki/Zero-knowledge_proof" frontend/app/me/page.tsx
      - cmd: grep -q 'rel="noreferrer"' frontend/app/me/page.tsx
      # Regression gate: all 19 locales' "me.gs.anonymousNote" must contain
      # exactly one "{zk}" placeholder (component does text.split("{zk}"),
      # renders the link only if that yields exactly 2 parts — a locale with
      # zero or two+ occurrences silently loses the link, not a crash, but a
      # content bug) and all 19 must carry a non-empty "me.gs.zkLink".
      - cmd: |
          node -e '
          const fs = require("fs");
          const src = fs.readFileSync("frontend/lib/i18n.generated.ts", "utf8");
          const notes = [...src.matchAll(/"me\.gs\.anonymousNote":\s*"((?:[^"\\]|\\.)*)"/g)].map((m) => m[1]);
          const links = [...src.matchAll(/"me\.gs\.zkLink":\s*"((?:[^"\\]|\\.)*)"/g)].map((m) => m[1]);
          if (notes.length !== 19) { console.error("expected 19 anonymousNote entries, found " + notes.length); process.exit(1); }
          if (links.length !== 19) { console.error("expected 19 zkLink entries, found " + links.length); process.exit(1); }
          const badSplit = notes.filter((n) => n.split("{zk}").length !== 2);
          if (badSplit.length) { console.error(badSplit.length + " anonymousNote value(s) do not contain exactly one {zk} placeholder"); process.exit(1); }
          const emptyLink = links.filter((l) => !l.trim());
          if (emptyLink.length) { console.error(emptyLink.length + " empty zkLink value(s)"); process.exit(1); }
          console.log("PASS — AnonymousNote zk-link wired correctly in all 19 locales.");
          '
    # TIMELINE (2026-08-12, F82/F83 round): first observed with the {zk}
    # placeholder ABSENT from all 19 anonymousNote strings and zkLink present
    # in only the English PAGE_STRINGS block — at that point in the round the
    # component's own length!==2 guard made it a safe no-op (plain text,
    # identical to pre-existing behaviour), not a regression. The gap was
    # closed by the main agent DURING this Sentinel round (working-tree drift
    # observed live — see the NRR's "mid-round drift" note); re-verified here
    # against the round's final state: functional in all 19 locales.
    # STILL OUTSTANDING: no BACKLOG.md row, no docs/shipped.md entry — this is
    # now genuinely shipped, user-facing behaviour with no product-backlog
    # identity (no F-number). Missing-coverage rule (Sentinel spec §4):
    # WARNING this round (Sentinel added its own gate above the same round it
    # was found); becomes a FAIL next round if it still has no BACKLOG.md
    # row/F-number and no docs/shipped.md entry.

