         derivation); the domain tag \"aha-shard-seal-v1:<role>:<code>\" is
         the one production key-derivation string"
    findings_this_round:
      - severity: WARNING (dependency hygiene, not a locked-position or privacy
          violation)
        what: "frontend/components/ShardSend.tsx does `import QRCode from
          \"qrcode\"`, but frontend/package.json declares NO direct dependency
          on `qrcode` (neither dependencies nor devDependencies — confirmed by
          direct grep and by a Python json-load check). It resolves today only
          because `qrcode` is a TRANSITIVE dependency of
          `@solana-mobile/wallet-standard-mobile` (see package-lock.json:1532,
          5423) — i.e. it is present in node_modules and pinned in the
          lockfile today by accident of an unrelated package's dependency
          tree, not by a declared intent to use it. `npx tsc --noEmit` is
          silent about this (it only typechecks against whatever resolves,
          it does not check registered dependencies) — a matching
          frontend/types/qrcode.d.ts ambient module declaration exists, which
          is exactly what a genuinely-undeclared-but-resolving import looks
          like from tsc's point of view."
        why_it_matters: "If @solana-mobile/wallet-standard-mobile ever drops
          or version-bumps past its own dependency on qrcode, or a future
          `npm install` (not `npm ci`) re-resolves the tree differently, the
          QR-rendering half of the ENTIRE in-person shard handover flow (the
          only mechanism this system has for moving a shard between two
          devices without a network) silently stops resolving — a build
          break with no compiler warning pointing at the real cause, exactly
          when a member needs shard handover working."
        reproduction: "cd frontend && grep -n 'import QRCode from \"qrcode\"'
          components/ShardSend.tsx; python3 -c \"import json; d=json.load(
          open('package.json')); print('qrcode' in d.get('dependencies',{}),
          'qrcode' in d.get('devDependencies',{}))\"  # -> False False"
        does_not_affect: "current build/typecheck/runtime — the package is
          present and pinned right now; NFC and manual-entry handover paths
          do not use qrcode at all and are unaffected either way"
        disposition: "not a locked-position or privacy-invariant violation
          (no CRITICAL), not yet a functional break (no FAIL on its own) —
          reported as a dependency-hygiene finding the round should close by
          adding `\"qrcode\": \"^1.5.4\"` to frontend/package.json's direct
          dependencies. Sentinel gate added below so it does not regress
          silently."
    coverage_gaps:
      - "no Playwright/e2e suite exists in this repo (long-standing, all
