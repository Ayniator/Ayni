  - id: F34-TREASURY-ORPHAN-KNOWN-HOLE
    name: "KNOWN, PROVEN, UNFIXED fund-safety hole (CRITICAL severity,
      pre-existing -- NOT a regression). execute_child_close closes a
      child Circle account but never checks or sweeps the separate
      ['treasury', circle] PDA. Every spend path needs the Circle account
      to deserialise, so the funds go unreachable -- but Circle is a PDA of
      (parent, name) and initialize_circle is permissionless with caller-
      chosen seats, so a stranger re-registers the same name, seats
      themselves 4-of-7, and drains the orphaned treasury. Documented in
      docs/testing-foundation.md, proven by tests/treasury-orphan.ts (6/6),
      reproduced independently by the f59-presence round from a clean
      deploy. Three devnet treasuries funded today (0.1/0.205/0.08 SOL) are
      reachable. Cheapest fix (not applied -- governance decision for the
      user): require treasury.lamports == 0 in execute_child_close."
    shipped_round: f59-presence (2026-08-15, first recorded here)
    covered_by:
      - "reports/sentinel/NRR-2026-08-15-f59-presence.md (CRITICAL finding)"
      - "tests/treasury-orphan.ts -- 6/6 on a local validator; NEVER run
         against devnet (step 5 really moves funds). Assertions written so a
         FIX turns them red."
      - "docs/testing-foundation.md sec 0 and 4.5."
    checks:
      - cmd: "test -f tests/treasury-orphan.ts"
      - cmd: "grep -q 'treasury.lamports' programs/ayni/src/instructions/execute_child_close.rs || echo 'HOLE STILL OPEN (expected until fixed)'"
