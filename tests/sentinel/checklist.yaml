      - name: BPF build + IDL
        cmd: anchor build
        note: containerized (ubuntu:24.04 or rust:1-slim + platform-tools cache);
          round 2 confirmed target/deploy/ayni.so built (63 instructions,
          target/idl/ayni.json), cited from the round-2 briefing, not
          independently re-executed by Sentinel this round
