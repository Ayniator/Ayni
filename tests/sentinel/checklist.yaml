# Round governance (2026-08-14). Scope: TWO commits, briefed HEAD 1dfefa1
# (HEAD drifted to 114f3af DURING this round -- a concurrent, unrelated
# glossary-content commit, `git show 114f3af --stat`: frontend/public/
