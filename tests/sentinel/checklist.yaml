  - id: F63v2
    name: Mailbox metadata mixing (E7 v2) — jitter/buckets, cover traffic, padding, constant-rate polling
    shipped_round: f35-f63v2
    covered_by: [tests/mailbox-mixing.test.mjs, tests/sentinel/f63-mixing-check.sh]
    checks:
      - cmd: test -f frontend/lib/mailboxMixing.ts
      - cmd: test -f docs/messaging.md
      - cmd: bash tests/sentinel/f63-mixing-check.sh
    cases:
      - "cover: a dummy is byte-identical in shape to real mail (op, fields,
         1040-byte ciphertext, padded request); the marker lives INSIDE the
         ciphertext as a distinct field, never a body prefix, so no real
         message can be suppressed by its own text"
      - "cover: the relay's code (not its comments) never reads or branches on
         the cover marker — it cannot acquire one"
      - "cover: capped at maxOutstandingCover=16, strictly under MAX_PER_BOX=500
         — cover can never FIFO-evict real mail"
      - "cover: a real send suppresses the next scheduled dummy (put rate stays
         flat whether or not the member is writing)"
      - "timing: mbxReleaseAt is a monotone non-decreasing ceiling — ordering
         is never inverted; get sorts on full-precision arrival time strictly
         before the 100-row page cap (a STRENGTHENING of v1, which sorted on
         whole-second ts and left same-second order to readdir)"
      - "padding: every request pads to a 2 KiB block, every reply to a fixed
         or power-of-two-row size class — enrolled/unenrolled bundle replies
         indistinguishable, get replies leak only log2(count)"
      - "polling: planTick takes only (state, config, clock) — mailbox
         contents cannot influence the schedule"
      - "storage: v1 bare-envelope files still deliver under v2 code (readStored
         falls back to releaseAt=0); v2 rows are {v:2, releaseAt, env}"
      - "copy: msg.inbox.metadata states BOTH the new protections and the
         residual leaks (source IP next to mailbox id, first contact
         uncovered) — verified this does not over-claim OR under-claim"
      - "docs/messaging.md §5 documents all four declared residuals (IP
         correlation, first-contact, prekey-directory enrollment oracle,
         16-dummy cover-budget cap) plainly, without softening"
    uncovered:
      - "no adversarial/statistical suite that actually measures traffic
         analysis resistance (e.g. simulates a passive relay operator and
         checks correlation strength) — the checks above are structural/static,
         not empirical. Reasonable given cover/jitter are probabilistic by
         design, but worth naming as a gap."
      - "docs/shipped.md and BACKLOG.md's F63 row were NOT updated for v2 as of
         this round (BACKLOG.md still reads 'v1 shipped ... remaining for v2:
         ... relay mixing/batching') — a docs-drift gap flagged in the
         f35-f63v2 NRR for the main agent to close; Sentinel does not edit
         either file itself."
      - "Playwright e2e coverage of the inbox under mixing (does a member
         actually see their mail arrive, does the compose flow still work)
         was reported in-progress by a separate agent this round — not yet
         reviewed as final."

