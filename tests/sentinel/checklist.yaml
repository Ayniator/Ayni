         membership.rs explicitly does NOT touch the tree (comment at lines
         59-60) — the provisional-cannot-vote property is structural, not a UI
         flag, confirmed by code reading."
    uncovered:
      - "the structural 'provisional cannot vote' half needs a real ZK ballot
         attempt against a tree that lacks the commitment — devnet flow"
      - no UI-level test of the attest input / AdmissionsSection

  - id: no-third-party-assets
    name: "No third-party asset fetches in shipped CSS (Google Fonts leak, fixed mid-round)"
    shipped_round: f35-f63v2
    covered_by: [tests/sentinel/no-third-party-assets-check.sh]
    checks:
      - cmd: bash tests/sentinel/no-third-party-assets-check.sh
    notes: >
      Discovered and FIXED mid-round (commit f337f72, by the disclosed
      in-progress Playwright/e2e agent, outside this round's original F35/
      F63v2/F91 scope but reviewed here because it landed on HEAD during this
