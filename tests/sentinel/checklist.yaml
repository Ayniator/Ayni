    findings_this_round:
      - severity: CRITICAL
        what: "commit_maci_tally is UNVERIFIED by the chain (the code's own
          doc-comment says so plainly: 'a coordinator willing to be caught
          can still commit a false tally') yet finalize_maci_round writes its
          result straight onto MemberProposal.passed, which
          install_elected_seat (Council seat installation) and
          refill_faucet (treasury -> faucet-jar outflow, up to
          FAUCET_MAX_REFILL_GRANTS x grant_lamports) both consume with NO
          awareness of whether the outcome came from real per-member votes
          (plain cast_vote path) or from one coordinator's unverified say-so
          (MACI path). Becoming that coordinator requires only ONE Council
          seat (open_maci_round calls council.require_any_seat, not the
          4-of-7 threshold every OTHER consequential Council action in this
          codebase requires -- see e.g. resilience.ts's own tests). There is
          no on-chain dispute-enforcement instruction: the 'challenge window'
          is just a timer finalize_maci_round waits out, not a mechanism
          that can reject a contested tally."
        contrast_with_docs: "BACKLOG.md's F39 row and R8, docs/shipped.md's
          MACI entry, and docs/maci.md itself are ALL STILL WRITTEN AS OF
          THIS COMMIT to say MACI is 'submission layer only... a round
          collects sealed commands and produces no verified result' --
          docs/maci.md even says in so many words 'Do not present MACI
          rounds as final-tallied until step 2 ships' where 'step 2' was
          specified to mean a ZK-VERIFIED tally circuit, not the
          trust-the-coordinator pinning shipped here. None of the three docs
          was updated in this commit or since. This is exactly the
          'uncommunicated change' / silent capability escalation Sentinel
          exists to catch."
        no_hostile_test: "tests/maci.ts and tests/maci-machine.ts test only
          an HONEST coordinator (correct tally, replay/reorder/censorship
          resistance of the message CHAIN, which the chain genuinely does
          enforce). Neither file has a single case where the coordinator
          commits a tally that does not match the actual sealed queue and
          asserts what happens downstream (nothing stops it; that is the
          gap)."
        never_wired_into_ci: "Confirmed by grep: tests/maci.ts and
          tests/maci-machine.ts appear in NO test command anywhere --
          Anchor.toml's [scripts] test= line lists 16 other files but not
          these two; Makefile's `test` target is `./scripts/test.sh` which
          is just `anchor test` (same list); no package.json script and no
          CI workflow references either file. The commit message's own
          claimed evidence ('cargo test... anchor build clean...
          tsc --noEmit clean') never mentions running these files, and
          COULD NOT have via any standard entrypoint -- they are orphaned.
          Independently run this round via explicit manual invocation only
          (see covered_by above); both pass, which rules out 'broken code'
          but not 'never-exercised-by-any-standard-command', which is itself
          the process failure."
        disposition: "CRITICAL, contributes to round FAIL. RECOMMENDATION:
          REVERT -- re-upgrade devnet to a build where commit_maci_tally and
          finalize_maci_round are removed or gated behind the same 4-of-7
          Council threshold (and real dispute enforcement) every other
          consequential action requires, BEFORE any Circle calls
          open_maci_round in a way that could reach install_elected_seat or
          refill_faucet. Until then, open_maci_round/maci_signup/
          publish_maci_message/close_maci_round/process_maci_messages remain
          individually inert/safe (confirmed: replay, reorder, and batch-
          integrity guards on the message CHAIN are genuinely enforced
          on-chain and were independently re-verified this round), so a
          narrower revert of just the two consequential instructions is
          sufficient if a full rollback is undesired. Separately, wire
          tests/maci.ts and tests/maci-machine.ts into Anchor.toml
          [scripts] test= and CI regardless of the above."
    verified_sound:
      - "No replay: a MaciMessage can only be folded when its index equals
