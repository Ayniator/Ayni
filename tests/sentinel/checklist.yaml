#
# PROCESS DISCLOSURE VERIFIED: 2f5a7c4 was authored by a concurrent session
# as commit 6cf0841 with message "o"; `git diff 2f5a7c4 6cf0841` is EMPTY
# (0 lines) and `git show 6cf0841 --stat` is byte-identical to `git show
# 2f5a7c4 --stat` (same 9 files, same 246/18) -- the reword claim is TRUE,
# content unchanged, only the message differs.
#
# THE DEFECT, independently re-derived against 7a10a48 (pre-fix): confirmed
# `begin_member_epoch` was `require_any_seat` (one of seven) and emptied
# MemberTree + zeroed `member_count`; `reinsert_member` is permissionless
# (Signer, no seat gate); `create_member_proposal` had NO require! on
# `voting_period`; `quorum_threshold(1,..)` is `.max(1)` = 1, so one `yes`
# from a manufactured one-leaf tree met quorum and passed, reaching
# `refill_faucet` and every member-vote-gated action. All five steps of the
# chain read and confirmed against the pre-fix source, not accepted on the
# commit's own narrative.
#
# THE FOUR CUTS, each independently verified:
#   a. MIN_TURNOUT=2 (state.rs) is a hardcoded floor in
#      finalize_member_proposal::member_vote_outcome, NOT read from
#      CircleConfig -- confirmed no single-seat-controlled path (including
#      set_circle_config, still any-seat, unchanged) can lower it, because
#      it isn't config-driven at all.
#   b. voting_period bounded `> 0 && <= MAX_VOTING_PERIOD` (90d) in
#      create_member_proposal, previously unchecked.
#   c. EPOCH_SETTLE_PERIOD (30d) read via a seed-bound `UncheckedAccount`
#      (`recent_roots`), not `Option<Account>` -- confirmed the seeds
#      constraint (`seeds=[b"roots", circle]`) makes the address
#      program-derived and non-substitutable, and that an account that has
#      never been written (`data_is_empty()`) is treated as settled
#      (skips the check entirely) rather than as a bypass -- correct,
#      because a Circle that never rebuilt has no manufactured electorate
#      to guard against.
#   d. begin_member_epoch now requires `proposal.executed` on a
#      `ProposalAction::BeginMemberEpoch` proposal bound to the same
#      Circle via `has_one = circle`, and burns it via `drained` before
#      touching state. Reproduced directly (see below): 3-of-7 refused,
#      4-of-7 + elapsed contest window succeeds, replay of the same
#      executed proposal is refused.
#
# DEFEAT ATTEMPTS (spec's own adversarial list), all checked:
#   - Two colluding seats: still short of the 4-of-7 needed to authorise
#     `begin_member_epoch`; no route found.
#   - set_circle_config (still any-seat, UNCHANGED by this commit) lowering
#     quorum/pass thresholds: quorum floor `.max(1)` was already the
#     mechanism the exploit used and remains reachable by one seat, but
#     MIN_TURNOUT=2 is NOT part of CircleConfig, so turnout<2 still refuses
#     regardless of tuning -- confirmed by reading member_vote_outcome and
#     by the `a_single_voice_never_passes_a_member_ballot` proptest, which
#     varies qn/qd across the FULL 0..1000 range and still refuses a lone
#     `yes`. RESIDUAL, NOT a defeat of this fix (see findings_this_round):
#     `vote_passes` with `p_num=0, p_den>0` (reachable by one seat via
#     set_circle_config) makes ANY turnout>=2 combination "pass" including
#     0-yes/2-no, because `yes*p_den >= p_num*turnout` degenerates to
#     `0 >= 0`. Still requires TWO distinct real voters, so it cannot
#     reproduce the one-seat-alone exploit, but is a real, previously
#     unexamined foot-gun in the pre-existing (unchanged) pass-rule
#     arithmetic, worth its own fix.
#   - Circle with exactly 2 or 3 members: 2 members triggers the
#     MIN_ELECTORATE parent-co-sign gate at proposal CREATION; 3 does not,
#     but MIN_TURNOUT=2 at FINALIZE still requires two distinct valid
#     membership-commitment votes either way -- a single human needs TWO
#     genuine memberships in the same Circle's tree to pass anything alone,
#     which is a (harder, separate, pre-existing) admission/personhood
#     concern, not something this commit introduces or worsens.
#   - Proposing before a rebuild rather than after: confirmed the
#     epoch-settle check is skipped entirely (`rr_ai.data_is_empty()`) for
