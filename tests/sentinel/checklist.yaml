# Round f35-f63v2 (2026-08-12, base commit b0bb874 + working tree) covers three
# changes: F35 activate_faucet_zk (anonymous faucet activation, PROGRAM CODE,
# highest scrutiny), F63 v2 mailbox metadata mixing (privacy copy, verified for
# both over-claim AND under-claim), and F91 Steps 1-2 (master-secret rooting
# groundwork, already committed in b0bb874 but never previously reviewed by
# Sentinel -- closed this round, see below).
