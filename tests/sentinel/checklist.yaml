# Sentinel master checklist (spec §1, backlog/sentinel-agent.md).
#
# Every shipped feature must appear here in the SAME round it ships. Missing
# coverage is a WARNING in round n and a FAIL in round n+1.
#
# `runnable` is what actually exists today, not what the spec assumes. The spec
# was written against an assumed layout (packages/proofs, test:e2e/test:api/
# test:adversarial, Playwright); none of that exists in this repo, so the layers
# are mapped onto what is real here. Do not delete a gap to make a round pass.

