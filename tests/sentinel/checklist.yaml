# Round f35-f63v2 (2026-08-12, base commit b0bb874 + working tree) covers three
# changes: F35 activate_faucet_zk (anonymous faucet activation, PROGRAM CODE,
# highest scrutiny), F63 v2 mailbox metadata mixing (privacy copy, verified for
# both over-claim AND under-claim), and F91 Steps 1-2 (master-secret rooting
# groundwork, already committed in b0bb874 but never previously reviewed by
# Sentinel -- closed this round, see below).
#
# F35 verified independently: `cargo test -p ayni --lib` 13/13 including the
# NEW `faucet_external_nullifier_binds_and_separates` proptest (confirms the
# domain-separation claim: the faucet's external nullifier is never equal to
# the raw newcomer commitment attest_admission_zk uses -- e[0] & 0xe0 == 0,
# deterministic, circle- and neophyte-bound); `pay_uniform_grant` extraction
# read line-for-line against the pre-F35 inline body -- genuinely
# behaviour-preserving (same order, same errors, same saturating arithmetic);
# `anchor build` from a CLEAN target/ (sbf + deploy removed first) built with
# NO stack-frame-overflow warning -- the Boxing fix holds; full `anchor test`
# 107 passing / 1 failing (the pre-existing quarantined epic2-reinsert-timing
# flake, confirmed unrelated -- see known_flaky, retried twice more this round,
# still flaky, 2 different symptom shapes both timing-shaped). Relay allowlist
# entry cross-checked against the ActivateFaucetZk account order by hand
# (payerIndex 8 of 10 accounts) and against `tests/relayer.ts`'s own IDL
# cross-check, which passed. SELF-ENDORSEMENT CAPABILITY CHANGE (a tree member
# can now trigger their own first-gas grant, since an anonymous proof cannot
# be compared against the neophyte's own commitment without a new circuit --
# `establish_wing_peer` still refuses `mentee == wing`, but the ANONYMOUS
# instruction never re-checks that at grant time) judged NOT CRITICAL: it does
# not rank, name a sponsor, leak a relationship, or touch any of the seven
# Layer-D assertions -- if anything it strengthens sponsor-edge privacy -- and
# the bound that actually matters (one grant per commitment ever, uniform
# amount, own wallet, own jar, membership-door-gated) is unchanged. It is a
# genuine loosening of the *ceremony* (a neophyte no longer needs to wait for
# an external endorser to release capped, uniform gas money they were always
# entitled to), reported here as a WARNING-level design note, not a blocking
# finding -- see the NRR for the full reasoning. Declared gap (no real-proof
# e2e for activate_faucet_zk, same reason as F53) reconfirmed still open:
# WARNING this round (f35-f63v2); FAILS the round after this one if still
# uncovered when that round runs.
#
# F63 v2 verified independently: `node --test tests/mailbox-mixing.test.mjs`
# 27/27 (incl. a relay e2e against a real `next/server`-stubbed route);
# `tests/mailbox.ts` (v1, unchanged) still 9/9 as part of the full `anchor
# test` run above. NEW gate `tests/sentinel/f63-mixing-check.sh` (15 checks)
# written this round and holds 15/15: cover marker is a ciphertext field, not
# a body prefix; the relay's CODE (not its explanatory comments) never
# reads/branches on `cover`; cover budget (16) strictly under MAX_PER_BOX
# (500); `mbxReleaseAt` is a monotone next-grid-boundary ceiling with a
# divide-by-zero-safe off switch; `get` sorts on full-precision arrival time
# strictly before the 100-row cap; and BOTH the member-facing copy
# (`msg.inbox.metadata`) and `docs/messaging.md` Sec.5 state the residual
# leaks plainly (source-IP correlation, first-contact-uncovered,
# prekey-directory enrollment oracle, cover-budget cap) -- confirmed no
# over-claim of protection AND no under-claim of the leak. `docs/shipped.md`
# and `BACKLOG.md`'s F63 row still described v1 only ("remaining for v2:
# ... relay mixing/batching") -- a genuine docs-drift gap, flagged here for
# the main agent to close (Sentinel does not edit either file).
#
# F91 (Steps 1-2, committed in b0bb874 ahead of any Sentinel review) verified
# independently this round: `node tests/zk-field-constants.test.mjs` 22/22,
# confirming both the "R held Q's value, but the mask made it a provable no-op
# over 2000 draws" claim AND that no call site anywhere in frontend/ passes
