# Sentinel master checklist (spec §1, backlog/sentinel-agent.md).
#
# Every shipped feature must appear here in the SAME round it ships. Missing
# coverage is a WARNING in round n and a FAIL in round n+1.
#
# `runnable` is what actually exists today, not what the spec assumes. The spec
# was written against an assumed layout (packages/proofs, test:e2e/test:api/
# test:adversarial, Playwright); none of that exists in this repo, so the layers
# are mapped onto what is real here. Do not delete a gap to make a round pass.

round: 3
established: 2026-08-10
baseline_report: reports/sentinel/NRR-2026-08-10-2.md
previous_baseline_report: reports/sentinel/NRR-2026-08-10-1.md

# Focused addendum, not a full round bump: Round F (2026-08-11) added Layer F
# (Epic 11 sponsor recovery) coverage only, on top of whatever round: 3 ends up
# being when a full A-E re-execution happens. See reports/sentinel/NRR-2026-08-11-F.md.
layer_F_report: reports/sentinel/NRR-2026-08-11-F.md

layers:
  E_build_health:
    runnable:
      - name: program compiles
        cmd: cargo check --workspace --all-targets
        note: needs a C toolchain; on this host run it in the rust:1-slim container
      - name: BPF build + IDL
        cmd: anchor build
        note: containerized (ubuntu:24.04 or rust:1-slim + platform-tools cache);
          round 2 confirmed target/deploy/ayni.so built (63 instructions,
          target/idl/ayni.json), cited from the round-2 briefing, not
          independently re-executed by Sentinel this round
      - name: frontend typecheck
        cmd: cd frontend && npx tsc --noEmit
      - name: dependency audit
        cmd: npm audit --audit-level=critical
    gaps:
      - root `tsc` fails (pre-ES2020 target); frontend is clean — see NRR round 1 R9
      - prettier fails on 12 files (R10)
      - "round 2: neither cargo check nor the audit was independently re-run by
         Sentinel — both cited from the round-2 task briefing as known-green.
         Round 3 should re-verify directly rather than cite a third time."

  D_privacy_invariants:
    runnable:
      - name: forbidden-pattern sweep (hard gate)
        cmd: bash tests/sentinel/privacy-sweep.sh
        gates:
          - no analytics/telemetry SDK
          - no tracking pixels
          - no logging macros in the Anchor program
          - no console.* of identity material
          - no score/rating/rank/karma/reputation field on a member
        verified: "re-executed fresh round 2 (2026-08-10) — all 5 gates clean,
          unchanged from round 1. NOTE: this gate is a literal-string regex and
          does NOT catch Membership.level / ProgressToken (see R7) because
          neither uses a banned word — a known, acknowledged blind spot, not a
          bug in the script."
    # The seven Layer D assertions. These are ARCHITECTURAL: greps cannot decide
    # them, and no adversarial suite exists yet, so they are tracked, not gated.
    assertions:
      1_sponsor_edge: "VIOLATED overall, IMPROVED round 2 — the E2 anonymous
        AdmissionAttestation account (parrain=[0;32], attest_admission_zk.rs:60-65)
        genuinely contains no parrain identity, PASS at the account-state layer.
        Still VIOLATED because: (a) attest_admission.rs (named pilot) writes the
        parrain commitment in plain; (b) WingPeer (state.rs:396-406) unchanged;
        (c) the E2 tx itself is fee-paid by the parrain's own wallet
        (zk-vote.ts:200-203, no /api/relay exists yet — F55 open), so tx-history
        still deanonymizes the anonymous form."
      2_trust_list: n/a              # feature not built
      3_message_metadata: VIOLATED   # content sealed, recipient+timing public — unchanged round 2
      4_biometric: PASS              # no biometric/WebAuthn code exists — unchanged
      5_circle_roster: VIOLATED      # Membership stores commitment + owner publicly — unchanged round 2
      6_hidden_content: untestable   # per-element visibility not built — unchanged
      7_faucet_parrain_link: "VIOLATED overall, IMPROVED round 2 — the on-chain
        activate_faucet grant tx is unchanged (parrain Signer + recipient=owner,
        still public). BUT the treasurer ledger sub-requirement, absent in round
        1, now exists and holds: fixed-size nacl.box blobs
        (frontend/app/api/faucet-ledger/route.ts), decrypt-only-by-treasurer-key,
        one-time unlinkable codes, amount-uniform (FAUCET_AMOUNT_COOLDOWN,
        state.rs:745), independent activation (15-120s) + ledger-delivery
        (1-7min) jitter. Server-observed arrival order/timing is honestly
        acknowledged in both files' comments as a residual, blurred-not-erased
        channel; Sentinel notes it is weaker than claimed for low-volume
        circles specifically (near-unique correlation by elimination when
        grants are rare)."
    gaps:
      - "no adversarial suite (npm run test:adversarial) — the only thing that can
         PROVE assertions 1/3/5/7 rather than argue them. Highest-value gap,
         unchanged for 2 rounds."
      - "round 2: the forbidden-pattern sweep cannot detect R7-shaped violations
         (public per-member rank fields that don't use a banned literal word).
         Needs a semantic check, not just a regex, before round 3."

  C_proof_layer:
    runnable:
      - name: verifying-key integrity
        cmd: bash tests/sentinel/zk-integrity.sh
        checks: [vkey matches zkey, rust matches vkey, no placeholder keys]
        verified: "re-executed fresh round 2 in a node:20-bookworm-slim
          container (host has no native node) — all 9 checks pass, byte-
          identical to round 1 (1543/1540/3201 non-zero constants)."
      - name: program suites against a local validator
        cmd: anchor test --skip-build
        suites: [tests/ayni.ts, tests/resilience.ts, tests/cosign.ts, tests/faucet.ts, tests/epic1.ts]
        note: "round 2: 35/35 reported known-green per the round-2 briefing;
          NOT independently re-executed by Sentinel this round. Round 3 should
          re-run directly (recipe in tests/README.md, ubuntu:24.04 container)."
    gaps:
      - grant_level / issue_acknowledgment / verify_disclosure / prove_personhood
        have no end-to-end proof test
      - no CLI-vs-browser verifier parity check
      - "NEW round 2: attest_admission_zk (F53) has NO end-to-end proof test —
         tests/epic1.ts:232-251 only exercises confirm_admission's null-parrain
         branch with a hand-built named attestation, never the real ZK
         instruction. WARNING this round (feature is new); FAILs round 3 if
         still uncovered."

  B_api_contract:
    runnable: []
    gaps:
      - "no API contract suite. TWO routes now exist and are both wholly
         untested: frontend/app/api/circle-email (hardened round 1/2, still
         untested) and frontend/app/api/faucet-ledger (NEW round 2 — no
         seal/open round-trip test, no fixed-size-blob rejection test, no
         wrong-key-cannot-decrypt test, no queue-flush test)."

  A_ux_e2e:
    runnable:
      - name: unit tests
        cmd: npx ts-mocha tests/jazzicon.ts
        note: "not re-executed round 2 (no native node on host; not
          containerized this round — only the two scripts explicitly asked for
          were run in-container). Round 3 should re-run."
    gaps:
      - "no Playwright/e2e suite, so the spec's DOM assertion (no fraction,
         percentage, 'of 12', progress bar, star, score) never runs anywhere"
      - "NEW round 2: zero UI-level coverage of the admission stepper
         (attest/confirm), the faucet 'first gas' button + jitter countdown,
         or the treasurer ledger panel."

features:
  # id, what Sentinel checks, where it is covered today.
  - id: F35
    name: Epic 0 — gas faucet (+ F47 treasurer ledger, F48 disbursement jitter)
    shipped_round: 2
    covered_by: [tests/faucet.ts, tests/sentinel/privacy-sweep.sh]
    cases:
      - init by seat / refused to non-seat
      - Treasurer tunes within cap; above cap, zero, non-Treasurer, non-seat refused
      - one uniform grant paid to the neophyte's own wallet, parrain-triggered
      - second grant for the same commitment refused (nullifier init collision)
      - non-wing member and non-wing seat both refused
      - owner-less neophyte and wrong recipient refused
      - underfunded jar refused, rent floor preserved
      - refill refused when the vote is unfinalized or the hash does not match
      - jar isolation across two circles
      - Treasurer cannot aim a distinctive amount at one neophyte (cooldown)
    uncovered:
      - "refill ceiling (FaucetRefillTooLarge) and the happy-path refill: both sit
         behind `finalized && passed`, which needs a real Groth16 ballot — belongs
         to the devnet flow in tests/f28-election.ts"
      - no UI-level test of the treasurer panel or the parrain button
      - "F47 treasurer ledger (lib/faucetLedger.ts + /api/faucet-ledger) — code
         reviewed and Layer-D-assessed by Sentinel round 2 (see NRR-2 assertion
         #7), found sound in design, but has NO executable test: seal/open
         round-trip, fixed-size blob validation on the route, non-treasurer
         cannot decrypt, queue flush."
      - "F48 activation jitter (15-120s, me/page.tsx:353-356) + ledger delivery
         jitter (1-7min, faucetLedger.ts:37) — code-reviewed present and
         correctly wired; no automated decorrelation test exists (needs an
         adversarial suite)."

  - id: F50-F52
    name: Epic 1 — two-sponsor admission (amended v0.2)
    shipped_round: 2
    covered_by: [tests/epic1.ts]
    cases:
      - legacy issuance auto-creates the policy PDA with required=false
      - policy toggle seat-gated; legacy door closes when required
      - attestation refused from non-member / self
      - provisional issuance requires the attestation PDA
      - provisional leaves the member tree and member_count untouched
      - one parrain attestation per newcomer (PDA collision)
      - confirm is seat-gated; distinct-persons rule (parrain's seat refused)
      - confirm inserts into the tree, increments count, closes the marker (one-shot)
      - policy off restores the legacy door
      - "round 2 Sentinel confirmed by reading the code (not by new test): the
         member-tree insert (merkle::insert_leaf) and member_count increment
         happen ONLY in confirm_admission.rs (lines ~44-48); issue_provisional_
         membership.rs explicitly does NOT touch the tree (comment at lines
         59-60) — the provisional-cannot-vote property is structural, not a UI
         flag, confirmed by code reading."
    uncovered:
      - "the structural 'provisional cannot vote' half needs a real ZK ballot
         attempt against a tree that lacks the commitment — devnet flow"
      - no UI-level test of the attest input / AdmissionsSection

  - id: F53
    name: Epic 2 — anonymous vouch-proof (attest_admission_zk)
    shipped_round: 2
    covered_by: []
    reviewed_by: "Sentinel round 2, code reading only (NRR-2 assertion #1) —
      confirmed AdmissionAttestation.parrain == 0 and vouchnull PDA carries no
      payload for the anonymous path; confirmed the fee-payer/relayer gap
      (zk-vote.ts:200-203, no /api/relay) is real and honestly documented, not
      hidden."
    uncovered:
      - "END-TO-END ZK TEST MISSING: a real member_vote Groth16 proof →
         attest_admission_zk → issue_provisional → confirm_admission with a null
         parrain. Needs the browser/devnet proving flow (like tests/vote.ts,
         which cannot run headless). Until then attest_admission_zk is verified
         only by construction (reuses the F28-proven VK + public-signal order)
         plus round-2 Sentinel code reading. STILL a WARNING this round (F53
         shipped this round); escalates to FAIL in round 3 if still uncovered."
      - "Layer D dump-simulation of the attestation + vouchnull accounts: done
         by Sentinel manually this round (assertion #1), not by an automated
         adversarial suite — no suite exists to re-run this check
         mechanically next round."

  - id: F58
    name: Epic 4 — the Quipu page (member trust page)
    shipped_round: 4
    covered_by: [tests/quipu.ts]
    cases:
      - knot-date codec round-trips (encode/decode) — 4/4 headless
      - step→alchemical-stage colour mapping over the whole 1..=12 range
    non_comparative_assertion:
      - "components/QuipuNecklace.tsx and lib/trustpage.ts read/compute NO score,
         fraction, %, 'of 12', progress bar, star, or count. The step numeral in
         the SVG names WHICH step, never how many. A DOM-level Playwright
         assertion is still the proper gate (no e2e suite yet — Layer A gap)."
    uncovered:
      - "no Playwright DOM test asserting the rendered page has no forbidden
         counts/ratings (Layer A gap — the highest-value E4 coverage)"
      - bio + service history + ZK presence not built (E5/F59)

  - id: F60-F61
    name: Epic 5 — per-element visibility
    shipped_round: 5
    covered_by: [tests/epic5.ts]
    cases:
      - absent policy ⇒ my-circle default (no account)
      - member sets avatar/quipu/bio tiers; range-checked (tier > 2 rejected)
      - member can change it again
      - only the member may set it (stranger + seat both rejected)
    enforcement_note:
      - "read-path mayView() is APP-LEVEL in the pilot (viewer's own client
         checks its memberships) — honest limit in lib/visibility.ts; the
         privacy-correct enforcement is a ZK circle-membership proof + per-tier
         encryption (Phase 2). hidden ≡ absent verified in the trust page render."
    retrofit:
      - "Membership.level dropped from /me and the admin member list (Sentinel
         R7). ProgressToken chips remain, justified in docs/traditions-justifications.md."
    uncovered:
      - "no Playwright test that a viewer outside the audience sees a byte-shape-
         identical bare page (Layer A / spec's side-channel assertion)"
      - "roster (Membership.owner memcmp) + /board public-read still open (F61 remaining)"

  - id: F25
    name: Circle email notifications
    covered_by: []
    uncovered:
      - "the round-2 hardening of app/api/circle-email (chain verification of
         circleName/membership, IP rate limit) has no test — see layer B.
         Round 2 Sentinel confirmed by reading route.ts that the hardening is
         still present and not regressed."

  - id: F72-F79
    name: Epic 11 — Sponsor Recovery (two-of-three key shards)
    shipped_round: F (2026-08-11, focused Layer F round)
    covered_by: [tests/sharding.ts, reports/sentinel/NRR-2026-08-11-F.md]
    cases:
      - any TWO of three Shamir shards reconstruct the master exactly
      - any ONE shard reconstructs nothing
      - a corrupted shard fails loudly, never returns garbage-as-success
      - one master secret derives distinct zk-secret and wallet-seed (domain-separated)
      - member-present fast path requires a genuine member-role shard; two
        sponsor shards cannot masquerade as member-present
      - "sponsor-only recovery — refused before the 7-day window elapses,
         refused if the member cancelled, succeeds after the window if not
         cancelled"
      - re-sharing cuts a fresh incompatible set; an old shard + a new shard
        does not reconstruct
      - provisional members (one sponsor) have no sponsor recovery
        (sponsorRecoveryAvailable(1) === false)
      - "static — recovery/shardCustody/sharding contain no network/chain sink"
      - "static — ShardCustody exposes no enumeration path (no list/keys/count/
         entries/iterate/has, code-only, comments excluded)"
    layer_F_result: "all 9 Layer F assertions HOLD — see NRR-2026-08-11-F.md
      for file:line evidence per assertion. One architectural note (not a
      fail): the member-present role guard (recovery.ts:29-33) is a
      caller-declared-role check, not cryptographic — shard roles are
      indistinguishable by design (sharding.ts:36-38); real strength depends
      on F74 (in-person handover, not yet built) correctly gating which shard
      a device may call 'the member's own'."
    uncovered:
      - "F74 in-person QR/NFC handover not built — no network path exists
         today because there is no handover code at all yet, not because it
         was proven safe under load"
      - "not wired into any UI: no onboarding disclosure
         (sponsorRecoveryAvailable unused in frontend/app/onboarding/page.tsx),
         no handover screen, no recovery screen — F79's 'honest handover UI'
         explicitly remains per BACKLOG.md"
      - "tests/sharding.ts:122's no-network-sink regex omits sendTransaction
         and bare Connection( — narrower than the full pattern list Sentinel
         checked manually; recommend widening"
      - "no adversarial dump-simulation test (Layer D style) specifically for
         shard custody storage — assertion 3 (no structure links a shard to a
         member) was verified by Sentinel code-reading this round, not by an
         automated dump-and-inspect test"
