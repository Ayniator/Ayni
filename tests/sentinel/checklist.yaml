  # --- F84: surfaced mid-round (see the F82/F83 NRR timeline), given its
  # backlog identity the same day — BACKLOG.md row F84, docs/shipped.md
  # F82/F83/F84 section. Covers the /me AnonymousNote zk-link and the
  # BrandAyni tooltip link order (GitHub before Wikipedia).
  - id: F84
    name: "/me page: AnonymousNote component (in-sentence zk-proof Wikipedia link)"
    covered_by: []  # only this checklist's own grep/node checks below exist;
                     # no e2e/Playwright suite (Layer A gap, carried forward).
    checks:
      - cmd: grep -q "function AnonymousNote" frontend/app/me/page.tsx
      - cmd: grep -q "https://en.wikipedia.org/wiki/Zero-knowledge_proof" frontend/app/me/page.tsx
      - cmd: grep -q 'rel="noreferrer"' frontend/app/me/page.tsx
      # Regression gate: all 19 locales' "me.gs.anonymousNote" must contain
      # exactly one "{zk}" placeholder (component does text.split("{zk}"),
      # renders the link only if that yields exactly 2 parts — a locale with
      # zero or two+ occurrences silently loses the link, not a crash, but a
      # content bug) and all 19 must carry a non-empty "me.gs.zkLink".
      - cmd: |
          node -e '
          const fs = require("fs");
          const src = fs.readFileSync("frontend/lib/i18n.generated.ts", "utf8");
