      verified this round: the new gate is 4/4; the vendored file is
      byte-identical to the live node_modules copy except for exactly the
      4 stripped lines (1 @import + 3 'DM Sans' font-family prefixes); running
      the vendor script again reproduces the committed file exactly
      (idempotent); `tsc --noEmit` clean after the change. NOT yet reconciled
      into BACKLOG.md / docs/shipped.md — flagged in the f35-f63v2 NRR as a
      second docs-drift gap for the main agent to close.
